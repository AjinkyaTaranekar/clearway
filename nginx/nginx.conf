# VCS API Gateway — Nginx configuration
# Runs inside Docker Swarm; upstream names are Swarm service DNS names.

upstream iam_backend      { server iam-service:8082; }
upstream journey_backend  { server journey-service:8083; }
upstream capacity_backend { server capacity-service:8081; }
upstream map_backend      { server map-service:8084; }

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=booking:10m rate=5r/s;

server {
    listen 80;
    server_name _;

    # Security headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";

    # Health probe (used by load balancer health checks)
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # IAM / Auth service
    location /api/v1/auth/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://iam_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
        proxy_connect_timeout 5s;
    }

    # Journey service (booking — stricter rate limit)
    location /api/v1/journeys {
        limit_req zone=booking burst=10 nodelay;
        proxy_pass http://journey_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
        proxy_connect_timeout 5s;
    }

    # Admin endpoints (journey service)
    location /api/v1/admin/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://journey_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # Enforcement endpoints (journey service)
    location /api/v1/enforcement/ {
        limit_req zone=api burst=50 nodelay;
        proxy_pass http://journey_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
        proxy_connect_timeout 5s;
    }

    # Capacity service
    location /api/v1/capacity/ {
        limit_req zone=api burst=30 nodelay;
        proxy_pass http://capacity_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
        proxy_connect_timeout 5s;
    }

    # Map / Route service
    location /api/v1/routes/ {
        limit_req zone=api burst=30 nodelay;
        proxy_pass http://map_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
        proxy_connect_timeout 5s;
    }

    # Frontend — React SPA (static files served from /usr/share/nginx/html)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public, no-transform";
    }

    # Swagger docs (per service, proxied)
    location /docs/journey/   { proxy_pass http://journey_backend/swagger/; }
    location /docs/capacity/  { proxy_pass http://capacity_backend/swagger/; }
    location /docs/iam/       { proxy_pass http://iam_backend/swagger/; }
    location /docs/map/       { proxy_pass http://map_backend/swagger/; }
}
