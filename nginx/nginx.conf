# VCS API Gateway - Nginx configuration
# Runs inside Docker Swarm; upstream names are Swarm service DNS names.
# resolver 127.0.0.11 defers DNS resolution to request time so nginx starts
# even when backend services aren't yet up.

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=booking:10m rate=5r/s;

server {
    listen 80;
    server_name _;

    # Use Docker Swarm's embedded DNS resolver; defer resolution per-request
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Security headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";

    # Health probe (used by load balancer health checks)
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Region identifier - written at container startup from REGION env var
    location = /api/v1/region {
        access_log off;
        default_type application/json;
        add_header Cache-Control "no-cache, no-store";
        alias /usr/share/nginx/html/region.json;
    }

    # Notification service
    # /api/v1/notifications covers: list, mark-read, device-token
    # /api/v1/admin/notifications must come BEFORE /api/v1/admin/ (longer prefix wins)
    location /api/v1/admin/notifications {
        limit_req zone=api burst=20 nodelay;
        set $notification http://notification-service:8085;
        proxy_pass $notification;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }

    location /api/v1/notifications {
        limit_req zone=api burst=20 nodelay;
        set $notification http://notification-service:8085;
        proxy_pass $notification;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }

    # Map service  (CONN-8 fix: path is /api/v1/map/ - NOT the old /api/v1/routes/)
    location /api/v1/map/ {
        limit_req zone=api burst=30 nodelay;
        set $map http://map-service:8084;
        proxy_pass $map;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }

    # Route computation (map service) - higher timeout to accommodate external OSRM API latency
    location /api/v1/routes/ {
        limit_req zone=api burst=20 nodelay;
        set $map http://map-service:8084;
        proxy_pass $map;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }

    # IAM JWKS endpoint — must be exposed publicly so external clients can
    # verify RS256 tokens. Without this, /.well-known/jwks.json falls through
    # to the SPA try_files block and returns HTML, breaking Swagger "Try it out"
    # and any third-party token verification.
    location /.well-known/ {
        set $iam http://iam-service:8082;
        proxy_pass $iam;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
        proxy_connect_timeout 5s;
    }

    # IAM admin endpoints — must be routed to IAM service, not journey service.
    # This must appear BEFORE the broader /api/v1/admin/ block below.
    location /api/v1/admin/auth/ {
        limit_req zone=api burst=10 nodelay;
        set $iam http://iam-service:8082;
        proxy_pass $iam;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }

    # IAM / Auth service
    location /api/v1/auth/ {
        limit_req zone=api burst=20 nodelay;
        set $iam http://iam-service:8082;
        proxy_pass $iam;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }

    # Journey service (booking - stricter rate limit)
    location /api/v1/journeys {
        limit_req zone=booking burst=10 nodelay;
        set $journey http://journey-service:8083;
        proxy_pass $journey;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }

    # Admin endpoints (journey service)
    location /api/v1/admin/ {
        limit_req zone=api burst=20 nodelay;
        set $journey http://journey-service:8083;
        proxy_pass $journey;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }

    # Enforcement endpoints (journey service)
    location /api/v1/enforcement/ {
        limit_req zone=api burst=50 nodelay;
        set $journey http://journey-service:8083;
        proxy_pass $journey;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }

    # Capacity service
    location /api/v1/capacity/ {
        limit_req zone=api burst=30 nodelay;
        set $capacity http://capacity-service:8081;
        proxy_pass $capacity;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }

    # Frontend - React SPA (static files served from /usr/share/nginx/html)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public, no-transform";
    }

    # Swagger docs (per service, proxied)
    # rewrite maps /docs/<svc>/anything → /swagger/anything on the backend.
    # sub_filter rewrites /swagger/ back to /docs/<svc>/ in the HTML/JS response
    # so that the swagger UI loads doc.json and assets via the correct prefix.
    # Accept-Encoding '' disables gzip so sub_filter can read the body.
    location /docs/journey/ {
        set $journey http://journey-service:8083;
        rewrite ^/docs/journey/(.*)$ /swagger/$1 break;
        proxy_pass $journey;
        proxy_redirect ~^/swagger/(.*)$ /docs/journey/$1;
        sub_filter '/swagger/' '/docs/journey/';
        sub_filter_once off;
        sub_filter_types application/javascript;
        proxy_set_header Host $host;
        proxy_set_header Accept-Encoding '';
    }
    location /docs/capacity/ {
        set $capacity http://capacity-service:8081;
        rewrite ^/docs/capacity/(.*)$ /swagger/$1 break;
        proxy_pass $capacity;
        proxy_redirect ~^/swagger/(.*)$ /docs/capacity/$1;
        sub_filter '/swagger/' '/docs/capacity/';
        sub_filter_once off;
        sub_filter_types application/javascript;
        proxy_set_header Host $host;
        proxy_set_header Accept-Encoding '';
    }
    location /docs/iam/ {
        set $iam http://iam-service:8082;
        rewrite ^/docs/iam/(.*)$ /swagger/$1 break;
        proxy_pass $iam;
        proxy_redirect ~^/swagger/(.*)$ /docs/iam/$1;
        sub_filter '/swagger/' '/docs/iam/';
        sub_filter_once off;
        sub_filter_types application/javascript;
        proxy_set_header Host $host;
        proxy_set_header Accept-Encoding '';
    }
    location /docs/map/ {
        set $map http://map-service:8084;
        rewrite ^/docs/map/(.*)$ /swagger/$1 break;
        proxy_pass $map;
        proxy_redirect ~^/swagger/(.*)$ /docs/map/$1;
        sub_filter '/swagger/' '/docs/map/';
        sub_filter_once off;
        sub_filter_types application/javascript;
        proxy_set_header Host $host;
        proxy_set_header Accept-Encoding '';
    }
    location /docs/notification/ {
        set $notification http://notification-service:8085;
        proxy_pass $notification/swagger/;
    }
}
