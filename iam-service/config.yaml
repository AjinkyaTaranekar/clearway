server:
  port: 8082
  timeout: 30s

database:
  master:
    host: "localhost"
    port: 5432
    user: "postgres"
    password: ""
    dbname: "trafficservice"
    max_open_conns: 25
    max_idle_conns: 5
  slave:
    host: "localhost"
    port: 5432
    user: "postgres"
    password: ""
    dbname: "trafficservice"
    max_open_conns: 50
    max_idle_conns: 10

redis:
  host: "localhost:6379"
  password: ""
  db: 0

iam:
  private_key_path: "keys/private.pem"
  signing_kid: "key-dev-001"
  previous_kid: ""
  previous_pub_key_pem: ""
  access_token_ttl: 24h
  refresh_token_ttl: 168h
  bcrypt_cost: 12
  token_retention_days: 7
  cleanup_interval: 24h

logging:
  level: "info"
  format: "console"
