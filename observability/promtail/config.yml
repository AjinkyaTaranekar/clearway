server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
    relabel_configs:
      # Use container name as the stream label
      - source_labels: [__meta_docker_container_name]
        regex: '/?(.*)'
        target_label: container
      # Compose service name (local docker-compose)
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        regex: '(.+)'
        target_label: service
      # Swarm service name (strip stack prefix, e.g., vcs_iam-service -> iam-service)
      - source_labels: [service, __meta_docker_container_label_com_docker_swarm_service_name]
        regex: '^$;vcs_(.+)$'
        target_label: service
        replacement: '$1'
      # Fallback if the Swarm service name has no stack prefix.
      - source_labels: [service, __meta_docker_container_label_com_docker_swarm_service_name]
        regex: '^$;(.+)$'
        target_label: service
        replacement: '$1'
      - target_label: job
        replacement: docker-containers
      # Keep only VCS containers (drop non-project host/container noise)
      - source_labels: [service]
        regex: 'iam-service|capacity-service|journey-service|map-service|notification-service|nginx|db|redis|redis-exporter|prometheus|grafana|loki|promtail|cadvisor'
        action: keep
    pipeline_stages:
      # Parse zerolog JSON logs emitted by our Go services
      - json:
          expressions:
            level:   level
            message: message
            time:    time
            method:  method
            path:    path
            duration: duration
      - labels:
          level:
          method:
          path:
      - timestamp:
          source: time
          format: RFC3339
