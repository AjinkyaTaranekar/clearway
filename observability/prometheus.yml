global:
  scrape_interval:     15s
  evaluation_interval: 15s

scrape_configs:
  # ── Application services ───────────────────────────────────────────────────
  - job_name: iam-service
    static_configs:
      - targets: ['iam-service:8082']
        labels:
          service: iam-service

  - job_name: capacity-service
    static_configs:
      - targets: ['capacity-service:8081']
        labels:
          service: capacity-service

  - job_name: journey-service
    static_configs:
      - targets: ['journey-service:8083']
        labels:
          service: journey-service

  - job_name: map-service
    static_configs:
      - targets: ['map-service:8084']
        labels:
          service: map-service

  - job_name: notification-service
    static_configs:
      - targets: ['notification-service:8085']
        labels:
          service: notification-service

  # ── Infrastructure ─────────────────────────────────────────────────────────
  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']
    metric_relabel_configs:
      # Normalize service labels across Compose and Swarm for dashboard queries.
      - source_labels: [container_label_com_docker_compose_service]
        regex: '(.+)'
        target_label: container_service
        replacement: '$1'
        action: replace
      - source_labels: [container_service, container_label_com_docker_swarm_service_name]
        regex: '^$;vcs_(.+)$'
        target_label: container_service
        replacement: '$1'
        action: replace
      - source_labels: [container_service, container_label_com_docker_swarm_service_name]
        regex: '^$;(.+)$'
        target_label: container_service
        replacement: '$1'
        action: replace
      - source_labels: [container_service]
        regex: '(.+)'
        target_label: container_label_com_docker_compose_service
        replacement: '$1'
        action: replace
      - source_labels: [container_service]
        regex: '(.+)'
        target_label: service
        replacement: '$1'
        action: replace
      - source_labels: [container_service]
        regex: '.+'
        action: keep
      - regex: 'container_service'
        action: labeldrop

  - job_name: cockroachdb
    metrics_path: /_status/vars
    static_configs:
      - targets: ['db:8080']
        labels:
          service: cockroachdb

  - job_name: redis
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          service: redis
