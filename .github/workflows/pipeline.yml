              pids+=(\$!)
            done
            for pid in \"\${pids[@]}\"; do wait \$pid || exit 1; done
          "

      - name: Smoke test
        run: curl -f --retry 5 --retry-delay 5 http://${{ secrets.SWARM_HOST_AP }}/nginx-health
