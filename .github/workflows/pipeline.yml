            $CRDB --execute="CREATE TABLE IF NOT EXISTS schema_migrations (name TEXT PRIMARY KEY, applied_at TIMESTAMPTZ DEFAULT NOW());" 2>/dev/null || true
            for svc in iam-service capacity-service journey-service notification-service; do
              for f in $(ls ~/vcs/migrations/$svc/*.sql 2>/dev/null | sort); do
                name=$(basename "$f"); key="${svc}/${name}"
                applied=$($CRDB --format=tsv --execute="SELECT COUNT(1) FROM schema_migrations WHERE name='"'"'${key}'"'"'" 2>/dev/null | tail -1)
                if [ "$applied" = "0" ]; then
                  echo "Applying ${key}..."
                  docker exec -i "$DB" /cockroach/cockroach sql --insecure --host=localhost:26257 --database=trafficservice < "$f"
                  $CRDB --execute="INSERT INTO schema_migrations (name) VALUES ('"'"'${key}'"'"')" 2>/dev/null
                else
                  echo "Skip ${key} (already applied)"
                fi
              done
            done
          '

      - name: Copy stack file and observability configs
        run: |
          scp docker-stack.yml deploy@${{ secrets.SWARM_HOST_AP }}:~/vcs/docker-stack.yml
          ssh deploy@${{ secrets.SWARM_HOST_AP }} "mkdir -p ~/vcs/observability/loki ~/vcs/observability/promtail ~/vcs/observability/grafana/provisioning/datasources ~/vcs/observability/grafana/provisioning/dashboards"
          scp observability/prometheus.yml deploy@${{ secrets.SWARM_HOST_AP }}:~/vcs/observability/prometheus.yml
          scp observability/loki/local-config.yaml deploy@${{ secrets.SWARM_HOST_AP }}:~/vcs/observability/loki/local-config.yaml
          scp observability/promtail/config.yml deploy@${{ secrets.SWARM_HOST_AP }}:~/vcs/observability/promtail/config.yml
          scp observability/grafana/provisioning/datasources/datasources.yml deploy@${{ secrets.SWARM_HOST_AP }}:~/vcs/observability/grafana/provisioning/datasources/datasources.yml
          scp observability/grafana/provisioning/dashboards/dashboards.yml deploy@${{ secrets.SWARM_HOST_AP }}:~/vcs/observability/grafana/provisioning/dashboards/dashboards.yml
          scp observability/grafana/provisioning/dashboards/vcs-overview.json deploy@${{ secrets.SWARM_HOST_AP }}:~/vcs/observability/grafana/provisioning/dashboards/vcs-overview.json

      - name: Deploy stack
        env:
          REPO: ${{ needs.setup.outputs.repo_lc }}
          TAG:  ${{ needs.setup.outputs.tag }}
          SVCS: ${{ inputs.services }}
        run: |
          ssh deploy@${{ secrets.SWARM_HOST_AP }} "
            set -e
            REPO='${REPO}'; TAG='${TAG}'; SVCS='${SVCS}'
            [ \"\$SVCS\" = 'all' ] || [ -z \"\$SVCS\" ] && \
              SVCS='iam-service,journey-service,capacity-service,map-service,notification-service,nginx'
            if ! docker stack ls 2>/dev/null | grep -q '^vcs'; then
              GITHUB_REPOSITORY=\$REPO IMAGE_TAG=latest CRDB_JOIN='${{ secrets.CRDB_JOIN_AP }}' \
                docker stack deploy --with-registry-auth --prune -c ~/vcs/docker-stack.yml vcs
            fi
            GITHUB_REPOSITORY=\$REPO IMAGE_TAG=latest CRDB_JOIN='${{ secrets.CRDB_JOIN_AP }}' \
              docker stack deploy --with-registry-auth -c ~/vcs/docker-stack.yml vcs 2>/dev/null || true
            IFS=',' read -ra ARR <<< \"\$SVCS\"
            for svc in \"\${ARR[@]}\"; do
              svc=\$(echo \"\$svc\" | xargs)
              docker service update --image ghcr.io/\${REPO}/\${svc}:\${TAG} --with-registry-auth vcs_\${svc}
            done
          "

      - name: Wait for rollout
        env:
          SVCS: ${{ inputs.services }}
        run: |
          ssh deploy@${{ secrets.SWARM_HOST_AP }} "
            SVCS='${SVCS}'
            [ \"\$SVCS\" = 'all' ] || [ -z \"\$SVCS\" ] && \
              SVCS='iam-service,journey-service,capacity-service,map-service,notification-service,nginx'
            IFS=',' read -ra ARR <<< \"\$SVCS\"
            pids=()
            for svc in \"\${ARR[@]}\"; do
