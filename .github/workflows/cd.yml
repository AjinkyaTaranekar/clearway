name: CD — Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (default: git SHA)"
        required: false
      deploy_iam_service:
        description: "Deploy iam-service"
        type: boolean
        default: false
      deploy_journey_service:
        description: "Deploy journey-service"
        type: boolean
        default: false
      deploy_capacity_service:
        description: "Deploy capacity-service"
        type: boolean
        default: false
      deploy_map_service:
        description: "Deploy map-service"
        type: boolean
        default: false
      deploy_notification_service:
        description: "Deploy notification-service"
        type: boolean
        default: false
      deploy_nginx:
        description: "Deploy nginx (also rebuilds frontend)"
        type: boolean
        default: false

# Only one deployment at a time
concurrency:
  group: cd-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  SWARM_HOST: ${{ secrets.SWARM_HOST }}

jobs:

  # ── Compute which services to build/deploy ────────────────────────────────
  setup:
    name: Compute deploy matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
      needs_frontend: ${{ steps.build-matrix.outputs.needs_frontend }}
      is_full_deploy: ${{ steps.build-matrix.outputs.is_full_deploy }}
    steps:
      - id: build-matrix
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            MATRIX='{"include":[
              {"service":"iam-service","context":"iam-service"},
              {"service":"journey-service","context":"journey-service"},
              {"service":"capacity-service","context":"capacity-service"},
              {"service":"map-service","context":"map-service"},
              {"service":"notification-service","context":"notification-service"},
              {"service":"nginx","context":"nginx"}
            ]}'
            echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"
            echo "needs_frontend=true"  >> "$GITHUB_OUTPUT"
            echo "is_full_deploy=true"  >> "$GITHUB_OUTPUT"
          else
            INCLUDES=()
            NEEDS_FRONTEND=false

            [[ "${{ inputs.deploy_iam_service }}"          == "true" ]] && \
              INCLUDES+=('{"service":"iam-service","context":"iam-service"}')
            [[ "${{ inputs.deploy_journey_service }}"      == "true" ]] && \
              INCLUDES+=('{"service":"journey-service","context":"journey-service"}')
            [[ "${{ inputs.deploy_capacity_service }}"     == "true" ]] && \
              INCLUDES+=('{"service":"capacity-service","context":"capacity-service"}')
            [[ "${{ inputs.deploy_map_service }}"          == "true" ]] && \
              INCLUDES+=('{"service":"map-service","context":"map-service"}')
            [[ "${{ inputs.deploy_notification_service }}" == "true" ]] && \
              INCLUDES+=('{"service":"notification-service","context":"notification-service"}')
            if [[ "${{ inputs.deploy_nginx }}" == "true" ]]; then
              INCLUDES+=('{"service":"nginx","context":"nginx"}')
              NEEDS_FRONTEND=true
            fi

            if [[ ${#INCLUDES[@]} -eq 0 ]]; then
              echo "::error::No services selected — tick at least one service checkbox."
              exit 1
            fi

            JOINED=$(IFS=,; echo "${INCLUDES[*]}")
            MATRIX="{\"include\":[${JOINED}]}"
            echo "matrix=${MATRIX}"          >> "$GITHUB_OUTPUT"
            echo "needs_frontend=${NEEDS_FRONTEND}" >> "$GITHUB_OUTPUT"
            echo "is_full_deploy=false"      >> "$GITHUB_OUTPUT"
          fi

  # ── Build frontend (only when nginx is included) ──────────────────────────
  build-frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    needs: [setup]
    if: needs.setup.outputs.needs_frontend == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - run: npm run build
        working-directory: frontend

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  # ── Build & push Docker images ────────────────────────────────────────────
  build-push:
    name: "Build & push — ${{ matrix.service }}"
    runs-on: ubuntu-latest
    needs: [setup, build-frontend]
    # build-frontend is skipped when nginx is not selected — that is fine
    if: >-
      always() &&
      needs.setup.result == 'success' &&
      (needs.build-frontend.result == 'success' || needs.build-frontend.result == 'skipped')
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Download frontend dist (nginx image only)
        if: matrix.service == 'nginx'
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: nginx/html/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tag
        id: tag
        run: |
          TAG=${{ github.event.inputs.image_tag || github.sha }}
          echo "tag=${TAG:0:12}" >> "$GITHUB_OUTPUT"
          echo "repo_lc=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.tag.outputs.repo_lc }}/${{ matrix.service }}:${{ steps.tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ steps.tag.outputs.repo_lc }}/${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  # ── Deploy to Docker Swarm ────────────────────────────────────────────────
  deploy:
    name: Deploy to Swarm
    runs-on: ubuntu-latest
    needs: [setup, build-push]
    if: always() && needs.setup.result == 'success' && needs.build-push.result == 'success'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: tag
        run: |
          TAG=${{ github.event.inputs.image_tag || github.sha }}
          echo "tag=${TAG:0:12}" >> "$GITHUB_OUTPUT"
          echo "repo_lc=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SWARM_SSH_KEY }}
          known_hosts: ${{ secrets.SWARM_KNOWN_HOSTS }}

      # ── Full stack deploy (push to main) ──────────────────────────────────
      - name: Copy stack file to manager
        if: needs.setup.outputs.is_full_deploy == 'true'
        run: |
          scp docker-stack.yml \
            deploy@${{ env.SWARM_HOST }}:/opt/vcs/docker-stack.yml

      - name: Deploy full stack
        if: needs.setup.outputs.is_full_deploy == 'true'
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
          GITHUB_REPOSITORY: ${{ steps.tag.outputs.repo_lc }}
        run: |
          ssh deploy@${{ env.SWARM_HOST }} \
            "GITHUB_REPOSITORY=${GITHUB_REPOSITORY} IMAGE_TAG=${IMAGE_TAG} \
             docker stack deploy \
               --with-registry-auth \
               --prune \
               -c /opt/vcs/docker-stack.yml \
               vcs"

      # ── Selective service update (workflow_dispatch) ───────────────────────
      - name: Update selected services
        if: needs.setup.outputs.is_full_deploy == 'false'
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
          REPO_LC: ${{ steps.tag.outputs.repo_lc }}
        run: |
          REGISTRY="${{ env.REGISTRY }}"
          CMD=""

          declare -A SELECTED=(
            [iam-service]="${{ inputs.deploy_iam_service }}"
            [journey-service]="${{ inputs.deploy_journey_service }}"
            [capacity-service]="${{ inputs.deploy_capacity_service }}"
            [map-service]="${{ inputs.deploy_map_service }}"
            [notification-service]="${{ inputs.deploy_notification_service }}"
            [nginx]="${{ inputs.deploy_nginx }}"
          )

          for SVC in "${!SELECTED[@]}"; do
            if [[ "${SELECTED[$SVC]}" == "true" ]]; then
              echo "Queuing update for vcs_${SVC} → ${IMAGE_TAG}"
              CMD+="docker service update --with-registry-auth \
                --image ${REGISTRY}/${REPO_LC}/${SVC}:${IMAGE_TAG} \
                vcs_${SVC}; "
            fi
          done

          ssh deploy@${{ env.SWARM_HOST }} "${CMD}"

      # ── Wait & smoke test ─────────────────────────────────────────────────
      - name: Wait for rollout
        run: |
          ssh deploy@${{ env.SWARM_HOST }} "
            for svc in vcs_nginx vcs_journey-service vcs_iam-service \
                       vcs_capacity-service vcs_map-service vcs_notification-service; do
              echo \"Waiting for \$svc...\"
              docker service ls --filter name=\$svc --format '{{.Replicas}}'
            done
          "

      - name: Smoke test
        run: |
          sleep 15
          curl -f --retry 5 --retry-delay 5 \
            http://${{ env.SWARM_HOST }}/nginx-health

      - name: Notify on failure
        if: failure()
        run: |
          echo "Deployment failed — check Swarm service logs on the manager."
          echo "Run: docker service ps vcs_journey-service --no-trunc"
