name: CD — Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (default: git SHA)"
        required: false

# Only one deployment at a time
concurrency:
  group: cd-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # Swarm manager SSH target — set in repo secrets
  SWARM_HOST: ${{ secrets.SWARM_HOST }}

jobs:

  # ── Build frontend ────────────────────────────────────────────────────────
  build-frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - run: npm run build
        working-directory: frontend

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  # ── Build & push Docker images ────────────────────────────────────────────
  build-push:
    name: "Build & push — ${{ matrix.service }}"
    runs-on: ubuntu-latest
    needs: [build-frontend]
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: iam-service
            context: iam-service
          - service: journey-service
            context: journey-service
          - service: capacity-service
            context: capacity-service
          - service: map-service
            context: map-service
          - service: notification-service
            context: notification-service
          - service: nginx
            context: nginx

    steps:
      - uses: actions/checkout@v4

      - name: Download frontend dist (nginx image only)
        if: matrix.service == 'nginx'
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: nginx/html/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tag
        id: tag
        run: |
          TAG=${{ github.event.inputs.image_tag || github.sha }}
          echo "tag=${TAG:0:12}" >> "$GITHUB_OUTPUT"
          echo "repo_lc=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.tag.outputs.repo_lc }}/${{ matrix.service }}:${{ steps.tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ steps.tag.outputs.repo_lc }}/${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  # ── Deploy to Docker Swarm ────────────────────────────────────────────────
  deploy:
    name: Deploy to Swarm
    runs-on: ubuntu-latest
    needs: [build-push]
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: tag
        run: |
          TAG=${{ github.event.inputs.image_tag || github.sha }}
          echo "tag=${TAG:0:12}" >> "$GITHUB_OUTPUT"
          echo "repo_lc=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SWARM_SSH_KEY }}
          known_hosts: ${{ secrets.SWARM_KNOWN_HOSTS }}

      - name: Copy stack file to manager
        run: |
          scp docker-stack.yml \
            deploy@${{ env.SWARM_HOST }}:/opt/vcs/docker-stack.yml

      - name: Deploy stack
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
          GITHUB_REPOSITORY: ${{ steps.tag.outputs.repo_lc }}
        run: |
          ssh deploy@${{ env.SWARM_HOST }} \
            "GITHUB_REPOSITORY=${GITHUB_REPOSITORY} IMAGE_TAG=${IMAGE_TAG} \
             docker stack deploy \
               --with-registry-auth \
               --prune \
               -c /opt/vcs/docker-stack.yml \
               vcs"

      - name: Wait for rollout
        run: |
          ssh deploy@${{ env.SWARM_HOST }} "
            for svc in vcs_nginx vcs_journey-service vcs_iam-service \
                       vcs_capacity-service vcs_map-service vcs_notification-service; do
              echo \"Waiting for \$svc...\"
              docker service ls --filter name=\$svc --format '{{.Replicas}}'
            done
          "

      - name: Smoke test
        run: |
          sleep 15
          curl -f --retry 5 --retry-delay 5 \
            http://${{ env.SWARM_HOST }}/nginx-health

      - name: Notify on failure
        if: failure()
        run: |
          echo "Deployment failed — check Swarm service logs on the manager."
          echo "Run: docker service ps vcs_journey-service --no-trunc"
