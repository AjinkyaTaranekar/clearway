name: CD — Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      regions:
        description: "Regions to deploy to"
        required: false
        default: "eu"
        type: choice
        options:
          - eu
          - us
          - apac
          - all
      image_tag:
        description: "Image tag to deploy (default: git SHA)"
        required: false

# Only one deployment at a time
concurrency:
  group: cd-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:

  # ── Build frontend ────────────────────────────────────────────────────────
  build-frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - run: npm run build
        working-directory: frontend

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  # ── Build & push Docker images ────────────────────────────────────────────
  build-push:
    name: "Build & push — ${{ matrix.service }}"
    runs-on: ubuntu-latest
    needs: [build-frontend]
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: iam-service
            context: iam-service
          - service: journey-service
            context: journey-service
          - service: capacity-service
            context: capacity-service
          - service: map-service
            context: map-service
          - service: notification-service
            context: notification-service
          - service: nginx
            context: nginx

    steps:
      - uses: actions/checkout@v4

      - name: Download frontend dist (nginx image only)
        if: matrix.service == 'nginx'
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: nginx/html/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tag
        id: tag
        run: |
          TAG=${{ github.event.inputs.image_tag || github.sha }}
          echo "tag=${TAG:0:12}" >> "$GITHUB_OUTPUT"
          echo "repo_lc=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.tag.outputs.repo_lc }}/${{ matrix.service }}:${{ steps.tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ steps.tag.outputs.repo_lc }}/${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  # ── Deploy to EU (europe-west1) ───────────────────────────────────────────
  deploy-eu:
    name: Deploy → EU (europe-west1)
    runs-on: ubuntu-latest
    needs: [build-push]
    # Auto-deploys on every push to main; manual dispatch needs regions=eu or all
    if: >
      github.event_name == 'push' ||
      github.event.inputs.regions == 'eu' ||
      github.event.inputs.regions == 'all'
    environment: production-eu

    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: tag
        run: |
          TAG=${{ github.event.inputs.image_tag || github.sha }}
          echo "tag=${TAG:0:12}" >> "$GITHUB_OUTPUT"
          echo "repo_lc=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SWARM_SSH_KEY }}
          known_hosts: ${{ secrets.SWARM_KNOWN_HOSTS_EU }}

      - name: Ensure deploy dir exists + GHCR login on all nodes
        run: |
          ssh deploy@${{ secrets.SWARM_HOST_EU }} "
            mkdir -p ~/vcs
            echo '${{ secrets.GHCR_PAT }}' | docker login ghcr.io -u AjinkyaTaranekar --password-stdin
          "

      - name: Copy stack file and nginx config
        run: |
          scp docker-stack.yml deploy@${{ secrets.SWARM_HOST_EU }}:~/vcs/docker-stack.yml
          scp nginx/nginx.conf deploy@${{ secrets.SWARM_HOST_EU }}:~/vcs/nginx.conf

      - name: Upsert nginx_conf Docker config
        run: |
          ssh deploy@${{ secrets.SWARM_HOST_EU }} "
            docker config rm nginx_conf 2>/dev/null || true
            docker config create nginx_conf ~/vcs/nginx.conf
          "

      - name: Deploy stack
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
          IMAGE_REPO: ${{ steps.tag.outputs.repo_lc }}
        run: |
          ssh deploy@${{ secrets.SWARM_HOST_EU }} \
            "GITHUB_REPOSITORY=${IMAGE_REPO} IMAGE_TAG=${IMAGE_TAG} \
             docker stack deploy \
               --with-registry-auth \
               --prune \
               -c ~/vcs/docker-stack.yml \
               vcs"

      - name: Wait for rollout
        run: |
          ssh deploy@${{ secrets.SWARM_HOST_EU }} "
            for svc in vcs_nginx vcs_journey-service vcs_iam-service \
                       vcs_capacity-service vcs_map-service vcs_notification-service; do
              echo \"Waiting for \$svc...\"
              timeout 120 bash -c \"until docker service ls --filter name=\$svc --format '{{.Replicas}}' | grep -q '2/2'; do sleep 5; done\"
              echo \"\$svc ready\"
            done
          "

      - name: Smoke test
        run: |
          sleep 10
          curl -f --retry 5 --retry-delay 5 http://${{ secrets.SWARM_HOST_EU }}/nginx-health

      - name: Notify on failure
        if: failure()
        run: |
          echo "EU deployment failed."
          echo "Debug: ssh deploy@${{ secrets.SWARM_HOST_EU }} 'docker service ps vcs_journey-service --no-trunc'"

  # ── Deploy to US (us-east1) ───────────────────────────────────────────────
  deploy-us:
    name: Deploy → US (us-east1)
    runs-on: ubuntu-latest
    needs: [build-push]
    if: >
      github.event.inputs.regions == 'us' ||
      github.event.inputs.regions == 'all'
    environment: production-us

    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: tag
        run: |
          TAG=${{ github.event.inputs.image_tag || github.sha }}
          echo "tag=${TAG:0:12}" >> "$GITHUB_OUTPUT"
          echo "repo_lc=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SWARM_SSH_KEY }}
          known_hosts: ${{ secrets.SWARM_KNOWN_HOSTS_US }}

      - name: Ensure deploy dir exists + GHCR login on all nodes
        run: |
          ssh deploy@${{ secrets.SWARM_HOST_US }} "
            mkdir -p ~/vcs
            echo '${{ secrets.GHCR_PAT }}' | docker login ghcr.io -u AjinkyaTaranekar --password-stdin
          "

      - name: Copy stack file and nginx config
        run: |
          scp docker-stack.yml deploy@${{ secrets.SWARM_HOST_US }}:~/vcs/docker-stack.yml
          scp nginx/nginx.conf deploy@${{ secrets.SWARM_HOST_US }}:~/vcs/nginx.conf

      - name: Upsert nginx_conf Docker config
        run: |
          ssh deploy@${{ secrets.SWARM_HOST_US }} "
            docker config rm nginx_conf 2>/dev/null || true
            docker config create nginx_conf ~/vcs/nginx.conf
          "

      - name: Deploy stack
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
          IMAGE_REPO: ${{ steps.tag.outputs.repo_lc }}
        run: |
          ssh deploy@${{ secrets.SWARM_HOST_US }} \
            "GITHUB_REPOSITORY=${IMAGE_REPO} IMAGE_TAG=${IMAGE_TAG} \
             docker stack deploy \
               --with-registry-auth \
               --prune \
               -c ~/vcs/docker-stack.yml \
               vcs"

      - name: Wait for rollout
        run: |
          ssh deploy@${{ secrets.SWARM_HOST_US }} "
            for svc in vcs_nginx vcs_journey-service vcs_iam-service \
                       vcs_capacity-service vcs_map-service vcs_notification-service; do
              echo \"Waiting for \$svc...\"
              timeout 120 bash -c \"until docker service ls --filter name=\$svc --format '{{.Replicas}}' | grep -q '1/1'; do sleep 5; done\"
              echo \"\$svc ready\"
            done
          "

      - name: Smoke test
        run: |
          sleep 10
          curl -f --retry 5 --retry-delay 5 http://${{ secrets.SWARM_HOST_US }}/nginx-health

      - name: Notify on failure
        if: failure()
        run: |
          echo "US deployment failed."
          echo "Debug: ssh deploy@${{ secrets.SWARM_HOST_US }} 'docker service ps vcs_journey-service --no-trunc'"

  # ── Deploy to APAC (asia-east1) ───────────────────────────────────────────
  deploy-apac:
    name: Deploy → APAC (asia-east1)
    runs-on: ubuntu-latest
    needs: [build-push]
    if: >
      github.event.inputs.regions == 'apac' ||
      github.event.inputs.regions == 'all'
    environment: production-apac

    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: tag
        run: |
          TAG=${{ github.event.inputs.image_tag || github.sha }}
          echo "tag=${TAG:0:12}" >> "$GITHUB_OUTPUT"
          echo "repo_lc=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SWARM_SSH_KEY }}
          known_hosts: ${{ secrets.SWARM_KNOWN_HOSTS_AP }}

      - name: Ensure deploy dir exists + GHCR login on all nodes
        run: |
          ssh deploy@${{ secrets.SWARM_HOST_AP }} "
            mkdir -p ~/vcs
            echo '${{ secrets.GHCR_PAT }}' | docker login ghcr.io -u AjinkyaTaranekar --password-stdin
          "

      - name: Copy stack file
        run: |
          scp docker-stack.yml deploy@${{ secrets.SWARM_HOST_AP }}:~/vcs/docker-stack.yml
          scp nginx/nginx.conf deploy@${{ secrets.SWARM_HOST_AP }}:~/vcs/nginx.conf

      - name: Upsert nginx_conf Docker config
        run: |
          ssh deploy@${{ secrets.SWARM_HOST_AP }} "
            docker config rm nginx_conf 2>/dev/null || true
            docker config create nginx_conf ~/vcs/nginx.conf
          "

      - name: Deploy stack
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
          IMAGE_REPO: ${{ steps.tag.outputs.repo_lc }}
        run: |
          ssh deploy@${{ secrets.SWARM_HOST_AP }} \
            "GITHUB_REPOSITORY=${IMAGE_REPO} IMAGE_TAG=${IMAGE_TAG} \
             docker stack deploy \
               --with-registry-auth \
               --prune \
               -c ~/vcs/docker-stack.yml \
               vcs"

      - name: Wait for rollout
        run: |
          ssh deploy@${{ secrets.SWARM_HOST_AP }} "
            for svc in vcs_nginx vcs_journey-service vcs_iam-service \
                       vcs_capacity-service vcs_map-service vcs_notification-service; do
              echo \"Waiting for \$svc...\"
              timeout 120 bash -c \"until docker service ls --filter name=\$svc --format '{{.Replicas}}' | grep -q '1/1'; do sleep 5; done\"
              echo \"\$svc ready\"
            done
          "

      - name: Smoke test
        run: |
          sleep 10
          curl -f --retry 5 --retry-delay 5 http://${{ secrets.SWARM_HOST_AP }}/nginx-health

      - name: Notify on failure
        if: failure()
        run: |
          echo "APAC deployment failed."
          echo "Debug: ssh deploy@${{ secrets.SWARM_HOST_AP }} 'docker service ps vcs_journey-service --no-trunc'"
