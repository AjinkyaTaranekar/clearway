name: CI

on:
  workflow_dispatch:
    inputs:
      test_frontend:
        description: "Test frontend"
        type: boolean
        default: false
      test_iam_service:
        description: "Test iam-service"
        type: boolean
        default: false
      test_journey_service:
        description: "Test journey-service"
        type: boolean
        default: false
      test_capacity_service:
        description: "Test capacity-service"
        type: boolean
        default: false
      test_map_service:
        description: "Test map-service"
        type: boolean
        default: false
      test_notification_service:
        description: "Test notification-service"
        type: boolean
        default: false
      docker_build_check:
        description: "Run Docker build validation"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── Compute matrix ────────────────────────────────────────────────────────
  setup:
    name: Compute test matrix
    runs-on: ubuntu-latest
    outputs:
      go_matrix: ${{ steps.build-matrix.outputs.go_matrix }}
      run_frontend: ${{ steps.build-matrix.outputs.run_frontend }}
      run_docker: ${{ steps.build-matrix.outputs.run_docker }}
      needs_frontend_artifact: ${{ steps.build-matrix.outputs.needs_frontend_artifact }}
    steps:
      - id: build-matrix
        run: |
          GO_INCLUDES=()
          RUN_FRONTEND=false
          RUN_DOCKER="${{ inputs.docker_build_check }}"
          NEEDS_FRONTEND_ARTIFACT=false

          [[ "${{ inputs.test_iam_service }}"          == "true" ]] && GO_INCLUDES+=('{"service":"iam-service"}')
          [[ "${{ inputs.test_journey_service }}"      == "true" ]] && GO_INCLUDES+=('{"service":"journey-service"}')
          [[ "${{ inputs.test_capacity_service }}"     == "true" ]] && GO_INCLUDES+=('{"service":"capacity-service"}')
          [[ "${{ inputs.test_map_service }}"          == "true" ]] && GO_INCLUDES+=('{"service":"map-service"}')
          [[ "${{ inputs.test_notification_service }}" == "true" ]] && GO_INCLUDES+=('{"service":"notification-service"}')

          [[ "${{ inputs.test_frontend }}" == "true" ]] && RUN_FRONTEND=true

          # Docker validation needs frontend artifact for nginx image
          if [[ "${RUN_DOCKER}" == "true" ]] || [[ "${RUN_FRONTEND}" == "true" ]]; then
            NEEDS_FRONTEND_ARTIFACT=true
          fi

          if [[ ${#GO_INCLUDES[@]} -eq 0 ]]; then
            GO_MATRIX='{"include":[]}'
          else
            JOINED=$(IFS=,; echo "${GO_INCLUDES[*]}")
            GO_MATRIX="{\"include\":[${JOINED}]}"
          fi

          if [[ ${#GO_INCLUDES[@]} -eq 0 ]] && \
             [[ "${RUN_FRONTEND}" == "false" ]] && \
             [[ "${RUN_DOCKER}" == "false" ]]; then
            echo "::error::No targets selected — tick at least one checkbox."
            exit 1
          fi

          echo "go_matrix=${GO_MATRIX}"                         >> "$GITHUB_OUTPUT"
          echo "run_frontend=${RUN_FRONTEND}"                   >> "$GITHUB_OUTPUT"
          echo "run_docker=${RUN_DOCKER}"                       >> "$GITHUB_OUTPUT"
          echo "needs_frontend_artifact=${NEEDS_FRONTEND_ARTIFACT}" >> "$GITHUB_OUTPUT"

  # ── Frontend ──────────────────────────────────────────────────────────────
  frontend:
    name: Frontend — build & test
    runs-on: ubuntu-latest
    needs: [setup]
    if: needs.setup.outputs.run_frontend == 'true' || needs.setup.outputs.needs_frontend_artifact == 'true'
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload dist artefact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  # ── Go services ───────────────────────────────────────────────────────────
  go-service:
    name: "${{ matrix.service }} — build & test"
    runs-on: ubuntu-latest
    needs: [setup]
    if: >-
      always() &&
      needs.setup.result == 'success' &&
      fromJSON(needs.setup.outputs.go_matrix).include[0] != null
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.go_matrix) }}

    defaults:
      run:
        working-directory: ${{ matrix.service }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.service }}/go.mod
          cache: true
          cache-dependency-path: ${{ matrix.service }}/go.sum

      - name: Tidy
        run: go mod tidy

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -v -race -timeout 60s ./...

  # ── Docker build validation ───────────────────────────────────────────────
  docker-build:
    name: "${{ matrix.service }} — docker build"
    runs-on: ubuntu-latest
    needs: [setup, frontend]
    if: >-
      always() &&
      needs.setup.result == 'success' &&
      needs.setup.outputs.run_docker == 'true' &&
      (needs.frontend.result == 'success' || needs.frontend.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: iam-service
            context: iam-service
          - service: journey-service
            context: journey-service
          - service: capacity-service
            context: capacity-service
          - service: map-service
            context: map-service
          - service: notification-service
            context: notification-service
          - service: nginx
            context: nginx

    steps:
      - uses: actions/checkout@v4

      - name: Download frontend dist (for nginx image)
        if: matrix.service == 'nginx'
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: nginx/html/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          tags: vcs-${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
