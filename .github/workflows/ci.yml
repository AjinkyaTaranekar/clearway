name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── Frontend ──────────────────────────────────────────────────────────────
  frontend:
    name: Frontend — build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload dist artefact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  # ── Go services ───────────────────────────────────────────────────────────
  go-service:
    name: "${{ matrix.service }} — build & test"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - iam-service
          - journey-service
          - capacity-service
          - map-service
          - notification-service

    defaults:
      run:
        working-directory: ${{ matrix.service }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.service }}/go.mod
          cache: true
          cache-dependency-path: ${{ matrix.service }}/go.sum

      - name: Tidy
        run: go mod tidy

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -v -race -timeout 60s ./...

  # ── Docker build validation ───────────────────────────────────────────────
  docker-build:
    name: "${{ matrix.service }} — docker build"
    runs-on: ubuntu-latest
    needs: [go-service, frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: iam-service
            context: iam-service
          - service: journey-service
            context: journey-service
          - service: capacity-service
            context: capacity-service
          - service: map-service
            context: map-service
          - service: notification-service
            context: notification-service
          - service: nginx
            context: nginx

    steps:
      - uses: actions/checkout@v4

      - name: Download frontend dist (for nginx image)
        if: matrix.service == 'nginx'
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: nginx/html/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          tags: vcs-${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
