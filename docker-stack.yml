# Docker Swarm production stack — VCS
#
# Topology: 3-node Swarm (1 manager + 2 workers) on Azure B1s VMs.
# Each VM runs one replica of every service (mode: global).
# PostgreSQL instances replicate to each other via logical replication
# (configured separately — see docs/postgres-replication.md).
# Redis is local to each node; no cross-node Redis sync.
#
# Deploy: docker stack deploy -c docker-stack.yml vcs
# Update:  docker stack deploy -c docker-stack.yml vcs  (rolling, zero-downtime)
#
# Required secrets (create with `docker secret create`):
#   db_password          — PostgreSQL user password
#   jwt_secret           — HS256 JWT signing secret
#   firebase_credentials — Firebase service account JSON (for notification-service)
#
# Required configs (create with `docker config create`):
#   nginx_conf           — nginx/nginx.conf

version: "3.9"

secrets:
  db_password:
    external: true
  jwt_secret:
    external: true
  firebase_credentials:
    external: true
  iam_private_key:
    external: true

networks:
  vcs-internal:
    driver: overlay
    attachable: true

volumes:
  pg_data:
    driver: local
  prometheus_data:
    driver: local
  loki_data:
    driver: local
  grafana_data:
    driver: local

services:

  # ── Data layer ─────────────────────────────────────────────────────────────

  db:
    image: postgres:16-alpine
    # mode: global ensures one PostgreSQL per Swarm node.
    # Each node owns its data via a local named volume.
    # Logical replication between nodes is configured via SQL (see docs/).
    deploy:
      mode: global
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      resources:
        limits:
          memory: 400M
        reservations:
          memory: 200M
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: trafficservice
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - vcs-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: >
      redis-server
      --maxmemory 96mb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
    deploy:
      mode: global
      restart_policy:
        condition: on-failure
        delay: 5s
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    networks:
      - vcs-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Application services ───────────────────────────────────────────────────
  # All use mode: global so each Swarm node runs exactly one replica,
  # matching the "every VM runs all services" architecture.

  iam-service:
    image: ghcr.io/${GITHUB_REPOSITORY}/iam-service:${IMAGE_TAG:-latest}
    deploy:
      mode: global
      update_config:
        parallelism: 1
        delay: 15s
        failure_action: rollback
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    environment:
      VCS_SERVER_PORT: "8082"
      VCS_DATABASE_MASTER_HOST: db
      VCS_DATABASE_MASTER_PORT: "5432"
      VCS_DATABASE_MASTER_USER: postgres
      VCS_DATABASE_MASTER_DBNAME: trafficservice
      VCS_DATABASE_SLAVE_HOST: db
      VCS_DATABASE_SLAVE_PORT: "5432"
      VCS_DATABASE_SLAVE_USER: postgres
      VCS_DATABASE_SLAVE_DBNAME: trafficservice
      VCS_REDIS_HOST: redis:6379
      VCS_IAM_PRIVATE_KEY_PATH: /run/secrets/iam_private_key
      VCS_LOGGING_LEVEL: info
      VCS_LOGGING_FORMAT: json
    secrets:
      - source: db_password
        target: /run/secrets/db_password
      - source: jwt_secret
        target: /run/secrets/jwt_secret
      - source: iam_private_key
        target: /run/secrets/iam_private_key
    networks:
      - vcs-internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  capacity-service:
    image: ghcr.io/${GITHUB_REPOSITORY}/capacity-service:${IMAGE_TAG:-latest}
    deploy:
      mode: global
      update_config:
        parallelism: 1
        delay: 15s
        failure_action: rollback
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    environment:
      VCS_SERVER_PORT: "8081"
      VCS_DATABASE_MASTER_HOST: db
      VCS_DATABASE_MASTER_PORT: "5432"
      VCS_DATABASE_MASTER_USER: postgres
      VCS_DATABASE_MASTER_DBNAME: trafficservice
      VCS_DATABASE_SLAVE_HOST: db
      VCS_DATABASE_SLAVE_PORT: "5432"
      VCS_DATABASE_SLAVE_USER: postgres
      VCS_DATABASE_SLAVE_DBNAME: trafficservice
      VCS_REDIS_HOST: redis:6379
      VCS_LOGGING_LEVEL: info
      VCS_LOGGING_FORMAT: json
    secrets:
      - source: db_password
        target: /run/secrets/db_password
    networks:
      - vcs-internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  map-service:
    image: ghcr.io/${GITHUB_REPOSITORY}/map-service:${IMAGE_TAG:-latest}
    deploy:
      mode: global
      update_config:
        parallelism: 1
        delay: 15s
        failure_action: rollback
        order: start-first
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    environment:
      VCS_SERVER_PORT: "8084"
      VCS_DATABASE_MASTER_HOST: db
      VCS_DATABASE_MASTER_PORT: "5432"
      VCS_DATABASE_MASTER_USER: postgres
      VCS_DATABASE_MASTER_DBNAME: trafficservice
      VCS_DATABASE_SLAVE_HOST: db
      VCS_DATABASE_SLAVE_PORT: "5432"
      VCS_DATABASE_SLAVE_USER: postgres
      VCS_DATABASE_SLAVE_DBNAME: trafficservice
      VCS_REDIS_HOST: redis:6379
      VCS_LOGGING_LEVEL: info
      VCS_LOGGING_FORMAT: json
    secrets:
      - source: db_password
        target: /run/secrets/db_password
    networks:
      - vcs-internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  journey-service:
    image: ghcr.io/${GITHUB_REPOSITORY}/journey-service:${IMAGE_TAG:-latest}
    deploy:
      mode: global
      update_config:
        parallelism: 1
        delay: 20s
        failure_action: rollback
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    environment:
      VCS_SERVER_PORT: "8083"
      VCS_DATABASE_MASTER_HOST: db
      VCS_DATABASE_MASTER_PORT: "5432"
      VCS_DATABASE_MASTER_USER: postgres
      VCS_DATABASE_MASTER_DBNAME: trafficservice
      VCS_DATABASE_SLAVE_HOST: db
      VCS_DATABASE_SLAVE_PORT: "5432"
      VCS_DATABASE_SLAVE_USER: postgres
      VCS_DATABASE_SLAVE_DBNAME: trafficservice
      VCS_REDIS_HOST: redis:6379
      VCS_SERVICES_CAPACITY_URL: http://capacity-service:8081
      VCS_SERVICES_MAP_URL: http://map-service:8084
      VCS_SERVICES_IAM_URL: http://iam-service:8082
      VCS_LOGGING_LEVEL: info
      VCS_LOGGING_FORMAT: json
    secrets:
      - source: db_password
        target: /run/secrets/db_password
      - source: jwt_secret
        target: /run/secrets/jwt_secret
    networks:
      - vcs-internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  notification-service:
    image: ghcr.io/${GITHUB_REPOSITORY}/notification-service:${IMAGE_TAG:-latest}
    deploy:
      mode: global
      update_config:
        parallelism: 1
        delay: 15s
        failure_action: rollback
        order: start-first
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      resources:
        limits:
          memory: 96M
        reservations:
          memory: 48M
    environment:
      VCS_SERVER_PORT: "8085"
      VCS_DATABASE_MASTER_HOST: db
      VCS_DATABASE_MASTER_PORT: "5432"
      VCS_DATABASE_MASTER_USER: postgres
      VCS_DATABASE_MASTER_DBNAME: trafficservice
      VCS_DATABASE_SLAVE_HOST: db
      VCS_DATABASE_SLAVE_PORT: "5432"
      VCS_DATABASE_SLAVE_USER: postgres
      VCS_DATABASE_SLAVE_DBNAME: trafficservice
      VCS_REDIS_HOST: redis:6379
      VCS_LOGGING_LEVEL: info
      VCS_LOGGING_FORMAT: json
    secrets:
      - source: db_password
        target: /run/secrets/db_password
      - source: firebase_credentials
        target: /run/secrets/firebase_credentials
    networks:
      - vcs-internal

  # ── Observability ──────────────────────────────────────────────────────────
  # cadvisor + promtail: global (one per Swarm node, collects local containers)
  # prometheus + loki + grafana: replicated on manager (centralised)

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    deploy:
      mode: global
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    networks:
      - vcs-internal

  promtail:
    image: grafana/promtail:2.9.4
    deploy:
      mode: global
      resources:
        limits:
          memory: 64M
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /root/vcs/observability/promtail/config.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - vcs-internal

  prometheus:
    image: prom/prometheus:v2.51.0
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    volumes:
      - /root/vcs/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    ports:
      - target: 9090
        published: 9090
        mode: host
    networks:
      - vcs-internal

  loki:
    image: grafana/loki:2.9.4
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    volumes:
      - /root/vcs/observability/loki/local-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - vcs-internal

  grafana:
    image: grafana/grafana:10.4.0
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - /root/vcs/observability/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - target: 3000
        published: 3000
        mode: host
    networks:
      - vcs-internal

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    deploy:
      mode: global
      resources:
        limits:
          memory: 32M
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres@db:5432/trafficservice?sslmode=disable"
      DATA_SOURCE_PASS_FILE: /run/secrets/db_password
    secrets:
      - source: db_password
        target: /run/secrets/db_password
    networks:
      - vcs-internal

  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    deploy:
      mode: global
      resources:
        limits:
          memory: 32M
    environment:
      REDIS_ADDR: redis:6379
    networks:
      - vcs-internal

  # ── API Gateway ────────────────────────────────────────────────────────────

  nginx:
    image: ghcr.io/${GITHUB_REPOSITORY}/nginx:${IMAGE_TAG:-latest}
    deploy:
      mode: global
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 32M
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: ingress       # ingress routing mesh — works with Swarm overlay healthchecks
    networks:
      - vcs-internal
    healthcheck:
      test: ["CMD-SHELL", "pgrep nginx > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
