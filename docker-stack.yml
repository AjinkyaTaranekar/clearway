# Docker Swarm production stack — VCS
#
# Topology: 3 independent Swarms (EU, US, APAC) on GCP e2-medium VMs.
# Each Swarm runs one replica of every service (mode: global or replicas: 1).
# CockroachDB forms a single distributed cluster across all 3 cells via Raft.
# Inter-node Raft traffic uses port 26257 over public IPs (GCP firewall rule required).
# Redis is local to each cell; no cross-cell Redis sync.
#
# Deploy: CRDB_JOIN=<eu1_ip>:26257,<eu2_ip>:26257,<us_ip>:26257,<ap_ip>:26257 \
#         docker stack deploy -c docker-stack.yml vcs
# Each CockroachDB container auto-detects its own external IP via GCP metadata API.
# Update:  same command (rolling, zero-downtime)
#
# Required secrets (create with `docker secret create`):
#   jwt_secret           — HS256 JWT signing secret
#   firebase_credentials — Firebase service account JSON (for notification-service)
#   iam_private_key      — IAM RSA private key
#
# One-time cluster bootstrap (run on EU node after first deploy):
#   docker exec -it <crdb_container> /cockroach/cockroach init --insecure --host=localhost:26257

version: "3.9"

secrets:
  jwt_secret:
    external: true
  firebase_credentials:
    external: true
  iam_private_key:
    external: true

configs:
  nginx_conf:
    external: true

networks:
  vcs-internal:
    driver: overlay
    attachable: true

volumes:
  crdb_data:
    driver: local
  prometheus_data:
    driver: local
  loki_data:
    driver: local
  grafana_data:
    driver: local

services:

  # ── Data layer ─────────────────────────────────────────────────────────────

  db:
    image: cockroachdb/cockroach:v24.1.0
    # mode: global — one CockroachDB node per Swarm VM per cell.
    # Each container fetches its own VM's external IP from GCP's metadata API
    # at startup, so --advertise-addr is always correct regardless of which
    # host the container lands on. No CRDB_ADVERTISE_IP env var needed.
    # Set CRDB_JOIN to a comma-separated list of ALL cell node IPs:26257
    # before running docker stack deploy (see header comment above).
    command:
      - "bash"
      - "-c"
      - >-
        EXTERNAL_IP=$$(curl -sf
        http://metadata.google.internal/computeMetadata/v1/instance/network-interfaces/0/access-configs/0/external-ip
        -H 'Metadata-Flavor: Google') &&
        exec /cockroach/cockroach start --insecure
        --advertise-addr=$$EXTERNAL_IP:26257
        --join=${CRDB_JOIN}
        --cache=.25
        --max-sql-memory=.25
    deploy:
      mode: global
      restart_policy:
        condition: any
        delay: 10s
        max_attempts: 10
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    ports:
      - target: 26257
        published: 26257
        protocol: tcp
        mode: host
      - target: 8080
        published: 8080
        protocol: tcp
        mode: host
    volumes:
      - crdb_data:/cockroach/cockroach-data
    networks:
      - vcs-internal
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    command: >
      redis-server
      --maxmemory 96mb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
    deploy:
      mode: global
      restart_policy:
        condition: on-failure
        delay: 5s
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    networks:
      - vcs-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Application services ───────────────────────────────────────────────────
  # All use mode: global so each Swarm node runs exactly one replica,
  # matching the "every VM runs all services" architecture.

  iam-service:
    image: ghcr.io/${GITHUB_REPOSITORY}/iam-service:${IMAGE_TAG:-latest}
    deploy:
      mode: global
      update_config:
        parallelism: 1
        delay: 15s
        failure_action: rollback
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    environment:
      VCS_SERVER_PORT: "8082"
      VCS_DATABASE_MASTER_HOST: db
      VCS_DATABASE_MASTER_PORT: "26257"
      VCS_DATABASE_MASTER_USER: postgres
      VCS_DATABASE_MASTER_DBNAME: trafficservice
      VCS_DATABASE_SLAVE_HOST: db
      VCS_DATABASE_SLAVE_PORT: "26257"
      VCS_DATABASE_SLAVE_USER: postgres
      VCS_DATABASE_SLAVE_DBNAME: trafficservice
      VCS_REDIS_HOST: redis:6379
      VCS_IAM_PRIVATE_KEY_PATH: /run/secrets/iam_private_key
      VCS_LOGGING_LEVEL: info
      VCS_LOGGING_FORMAT: json
    secrets:
      - source: jwt_secret
        target: /run/secrets/jwt_secret
      - source: iam_private_key
        target: /run/secrets/iam_private_key
    networks:
      - vcs-internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  capacity-service:
    image: ghcr.io/${GITHUB_REPOSITORY}/capacity-service:${IMAGE_TAG:-latest}
    deploy:
      mode: global
      update_config:
        parallelism: 1
        delay: 15s
        failure_action: rollback
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    environment:
      VCS_SERVER_PORT: "8081"
      VCS_DATABASE_MASTER_HOST: db
      VCS_DATABASE_MASTER_PORT: "26257"
      VCS_DATABASE_MASTER_USER: postgres
      VCS_DATABASE_MASTER_DBNAME: trafficservice
      VCS_DATABASE_SLAVE_HOST: db
      VCS_DATABASE_SLAVE_PORT: "26257"
      VCS_DATABASE_SLAVE_USER: postgres
      VCS_DATABASE_SLAVE_DBNAME: trafficservice
      VCS_REDIS_HOST: redis:6379
      VCS_LOGGING_LEVEL: info
      VCS_LOGGING_FORMAT: json
      VCS_SERVICES_CAPACITY_BASE_URL: http://capacity-service:8081
      VCS_SERVICES_JWKS_URL: http://iam-service:8082/.well-known/jwks.json
      VCS_SERVICES_NOMINATIM_BASE_URL: ${NOMINATIM_BASE_URL:-https://nominatim.openstreetmap.org}
      VCS_SERVICES_OSRM_BASE_URL: ${OSRM_BASE_URL:-https://router.project-osrm.org}
    networks:
      - vcs-internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  map-service:
    image: ghcr.io/${GITHUB_REPOSITORY}/map-service:${IMAGE_TAG:-latest}
    deploy:
      mode: global
      update_config:
        parallelism: 1
        delay: 15s
        failure_action: rollback
        order: start-first
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    environment:
      VCS_SERVER_PORT: "8084"
      VCS_DATABASE_MASTER_HOST: db
      VCS_DATABASE_MASTER_PORT: "26257"
      VCS_DATABASE_MASTER_USER: postgres
      VCS_DATABASE_MASTER_DBNAME: trafficservice
      VCS_DATABASE_SLAVE_HOST: db
      VCS_DATABASE_SLAVE_PORT: "26257"
      VCS_DATABASE_SLAVE_USER: postgres
      VCS_DATABASE_SLAVE_DBNAME: trafficservice
      VCS_REDIS_HOST: redis:6379
      VCS_LOGGING_LEVEL: info
      VCS_LOGGING_FORMAT: json
    networks:
      - vcs-internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  journey-service:
    image: ghcr.io/${GITHUB_REPOSITORY}/journey-service:${IMAGE_TAG:-latest}
    deploy:
      mode: global
      update_config:
        parallelism: 1
        delay: 20s
        failure_action: rollback
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    environment:
      VCS_SERVER_PORT: "8083"
      VCS_DATABASE_MASTER_HOST: db
      VCS_DATABASE_MASTER_PORT: "26257"
      VCS_DATABASE_MASTER_USER: postgres
      VCS_DATABASE_MASTER_DBNAME: trafficservice
      VCS_DATABASE_SLAVE_HOST: db
      VCS_DATABASE_SLAVE_PORT: "26257"
      VCS_DATABASE_SLAVE_USER: postgres
      VCS_DATABASE_SLAVE_DBNAME: trafficservice
      VCS_REDIS_HOST: redis:6379
      VCS_SERVICES_CAPACITY_URL: http://capacity-service:8081
      VCS_SERVICES_MAP_URL: http://map-service:8084
      VCS_SERVICES_IAM_URL: http://iam-service:8082
      VCS_LOGGING_LEVEL: info
      VCS_LOGGING_FORMAT: json
    secrets:
      - source: jwt_secret
        target: /run/secrets/jwt_secret
    networks:
      - vcs-internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  notification-service:
    image: ghcr.io/${GITHUB_REPOSITORY}/notification-service:${IMAGE_TAG:-latest}
    deploy:
      mode: global
      update_config:
        parallelism: 1
        delay: 15s
        failure_action: rollback
        order: start-first
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      resources:
        limits:
          memory: 96M
        reservations:
          memory: 48M
    environment:
      VCS_SERVER_PORT: "8085"
      VCS_DATABASE_MASTER_HOST: db
      VCS_DATABASE_MASTER_PORT: "26257"
      VCS_DATABASE_MASTER_USER: postgres
      VCS_DATABASE_MASTER_DBNAME: trafficservice
      VCS_DATABASE_SLAVE_HOST: db
      VCS_DATABASE_SLAVE_PORT: "26257"
      VCS_DATABASE_SLAVE_USER: postgres
      VCS_DATABASE_SLAVE_DBNAME: trafficservice
      VCS_REDIS_HOST: redis:6379
      VCS_LOGGING_LEVEL: info
      VCS_LOGGING_FORMAT: json
      JWKS_URL: http://iam-service:8082/.well-known/jwks.json
      VM_ID: "1"
      FCM_SERVICE_ACCOUNT_JSON: ${FCM_SERVICE_ACCOUNT_JSON:-}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase_credentials
    secrets:
      - source: firebase_credentials
        target: /run/secrets/firebase_credentials
    networks:
      - vcs-internal

  # ── Observability ──────────────────────────────────────────────────────────
  # cadvisor + promtail: global (one per Swarm node, collects local containers)
  # prometheus + loki + grafana: replicated on manager (centralised)

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    deploy:
      mode: global
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    networks:
      - vcs-internal

  promtail:
    image: grafana/promtail:2.9.4
    deploy:
      mode: global
      resources:
        limits:
          memory: 64M
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /root/vcs/observability/promtail/config.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - vcs-internal

  prometheus:
    image: prom/prometheus:v2.51.0
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    volumes:
      - /root/vcs/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    ports:
      - target: 9090
        published: 9090
        mode: host
    networks:
      - vcs-internal

  loki:
    image: grafana/loki:2.9.4
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    volumes:
      - /root/vcs/observability/loki/local-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - vcs-internal

  grafana:
    image: grafana/grafana:10.4.0
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - /root/vcs/observability/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - target: 3000
        published: 3000
        mode: host
    networks:
      - vcs-internal

  # CockroachDB exposes Prometheus metrics natively at http://db:8080/_status/vars
  # No separate exporter needed — prometheus.yml scrapes it directly.

  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    deploy:
      mode: global
      resources:
        limits:
          memory: 32M
    environment:
      REDIS_ADDR: redis:6379
    networks:
      - vcs-internal

  # ── API Gateway ────────────────────────────────────────────────────────────

  nginx:
    image: ghcr.io/${GITHUB_REPOSITORY}/nginx:${IMAGE_TAG:-latest}
    configs:
      - source: nginx_conf
        target: /etc/nginx/conf.d/vcs.conf
    environment:
      REGION: ${REGION:-EU}
    deploy:
      mode: global
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 32M
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: ingress       # ingress routing mesh — works with Swarm overlay healthchecks
    networks:
      - vcs-internal
    healthcheck:
      test: ["CMD-SHELL", "pgrep nginx > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
