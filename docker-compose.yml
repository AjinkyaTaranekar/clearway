# Local development — single-node, all services + dependencies
# Usage: docker compose up --build
version: "3.9"

services:

  # ── Data layer ─────────────────────────────────────────────────────────────

  db:
    image: cockroachdb/cockroach:v24.1.0
    restart: unless-stopped
    command: start-single-node --insecure
    ports:
      - "26257:26257"
      - "18080:8080"  # Admin UI (avoids conflict with cadvisor on 8080)
    volumes:
      - crdb_data:/cockroach/cockroach-data
    healthcheck:
      test: ["CMD-SHELL", "/cockroach/cockroach sql --insecure --execute='SELECT 1' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru --save ""
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Application services ───────────────────────────────────────────────────

  iam-service:
    build:
      context: ./iam-service
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      VCS_SERVER_PORT: 8082
      VCS_DATABASE_MASTER_HOST: db
      VCS_DATABASE_MASTER_PORT: 26257
      VCS_DATABASE_MASTER_USER: postgres
      VCS_DATABASE_MASTER_DBNAME: trafficservice
      VCS_DATABASE_SLAVE_HOST: db
      VCS_DATABASE_SLAVE_PORT: 26257
      VCS_DATABASE_SLAVE_USER: postgres
      VCS_DATABASE_SLAVE_DBNAME: trafficservice
      VCS_REDIS_HOST: redis:6379
      VCS_SERVICES_JWKS_URL: http://iam-service:8082/.well-known/jwks.json
      VCS_LOGGING_LEVEL: info
      VCS_SWAGGER_PUBLIC_BASE_URL: http://localhost
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  capacity-service:
    build:
      context: ./capacity-service
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      VCS_SERVER_PORT: 8081
      VCS_DATABASE_MASTER_HOST: db
      VCS_DATABASE_MASTER_PORT: 26257
      VCS_DATABASE_MASTER_USER: postgres
      VCS_DATABASE_MASTER_DBNAME: trafficservice
      VCS_DATABASE_SLAVE_HOST: db
      VCS_DATABASE_SLAVE_PORT: 26257
      VCS_DATABASE_SLAVE_USER: postgres
      VCS_DATABASE_SLAVE_DBNAME: trafficservice
      VCS_REDIS_HOST: redis:6379
      VCS_SERVICES_JWKS_URL: http://iam-service:8082/.well-known/jwks.json
      VCS_LOGGING_LEVEL: info
      VCS_SWAGGER_PUBLIC_BASE_URL: http://localhost
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  map-service:
    build:
      context: ./map-service
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8084:8084"
    environment:
      VCS_SERVER_PORT: 8084
      VCS_DATABASE_MASTER_HOST: db
      VCS_DATABASE_MASTER_PORT: 26257
      VCS_DATABASE_MASTER_USER: postgres
      VCS_DATABASE_MASTER_DBNAME: trafficservice
      VCS_DATABASE_SLAVE_HOST: db
      VCS_DATABASE_SLAVE_PORT: 26257
      VCS_DATABASE_SLAVE_USER: postgres
      VCS_DATABASE_SLAVE_DBNAME: trafficservice
      VCS_REDIS_HOST: redis:6379
      VCS_LOGGING_LEVEL: info
      VCS_SERVICES_CAPACITY_BASE_URL: http://capacity-service:8081
      VCS_SERVICES_JWKS_URL: http://iam-service:8082/.well-known/jwks.json
      VCS_SERVICES_NOMINATIM_BASE_URL: ${NOMINATIM_BASE_URL:-https://nominatim.openstreetmap.org}
      VCS_SERVICES_OSRM_BASE_URL: ${OSRM_BASE_URL:-https://router.project-osrm.org}
      VCS_SWAGGER_PUBLIC_BASE_URL: http://localhost
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      capacity-service:
        condition: service_healthy
      iam-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  journey-service:
    build:
      context: ./journey-service
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      VCS_SERVER_PORT: 8083
      VCS_DATABASE_MASTER_HOST: db
      VCS_DATABASE_MASTER_PORT: 26257
      VCS_DATABASE_MASTER_USER: postgres
      VCS_DATABASE_MASTER_DBNAME: trafficservice
      VCS_DATABASE_SLAVE_HOST: db
      VCS_DATABASE_SLAVE_PORT: 26257
      VCS_DATABASE_SLAVE_USER: postgres
      VCS_DATABASE_SLAVE_DBNAME: trafficservice
      VCS_REDIS_HOST: redis:6379
      VCS_SERVICES_CAPACITY_URL: http://capacity-service:8081
      VCS_SERVICES_MAP_URL: http://map-service:8084
      VCS_SERVICES_IAM_URL: http://iam-service:8082
      VCS_LOGGING_LEVEL: info
      VCS_SWAGGER_PUBLIC_BASE_URL: http://localhost
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      capacity-service:
        condition: service_healthy
      map-service:
        condition: service_healthy
      iam-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8085:8085"
    environment:
      VCS_SERVER_PORT: 8085
      VCS_DATABASE_MASTER_HOST: db
      VCS_DATABASE_MASTER_PORT: 26257
      VCS_DATABASE_MASTER_USER: postgres
      VCS_DATABASE_MASTER_DBNAME: trafficservice
      VCS_DATABASE_SLAVE_HOST: db
      VCS_DATABASE_SLAVE_PORT: 26257
      VCS_DATABASE_SLAVE_USER: postgres
      VCS_DATABASE_SLAVE_DBNAME: trafficservice
      VCS_REDIS_HOST: redis:6379
      VCS_LOGGING_LEVEL: info
      VCS_SERVICES_JWKS_URL: http://iam-service:8082/.well-known/jwks.json
      JWKS_URL: http://iam-service:8082/.well-known/jwks.json
      VM_ID: "1"
      FCM_SERVICE_ACCOUNT_JSON: ${FCM_SERVICE_ACCOUNT_JSON:-}
      VCS_SWAGGER_PUBLIC_BASE_URL: http://localhost
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      iam-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8085/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── API Gateway + Frontend ─────────────────────────────────────────────────

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      REGION: local
    depends_on:
      iam-service:
        condition: service_healthy
      journey-service:
        condition: service_healthy
      capacity-service:
        condition: service_healthy
      map-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy

  # ── Observability ──────────────────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:v2.51.0
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    depends_on:
      - cadvisor

  loki:
    image: grafana/loki:2.9.4
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./observability/loki/local-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml

  promtail:
    image: grafana/promtail:2.9.4
    restart: unless-stopped
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./observability/promtail/config.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:10.4.0
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - loki

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: unless-stopped
    privileged: true
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro

  # CockroachDB exposes Prometheus metrics natively at http://db:8080/_status/vars
  # No separate exporter needed — prometheus.yml scrapes it directly.

  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis:6379
    depends_on:
      redis:
        condition: service_healthy

volumes:
  crdb_data:
  prometheus_data:
  loki_data:
  grafana_data:
