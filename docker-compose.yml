# Local development — single-node, all services + dependencies
# Usage: docker compose up --build
version: "3.9"

services:

  # ── Data layer ─────────────────────────────────────────────────────────────

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: trafficservice
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru --save ""
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Application services ───────────────────────────────────────────────────

  iam-service:
    build:
      context: ./iam-service
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      VCS_SERVER_PORT: 8082
      VCS_DATABASE_MASTER_HOST: db
      VCS_DATABASE_MASTER_PORT: 5432
      VCS_DATABASE_MASTER_USER: postgres
      VCS_DATABASE_MASTER_PASSWORD: postgres
      VCS_DATABASE_MASTER_DBNAME: trafficservice
      VCS_DATABASE_SLAVE_HOST: db
      VCS_DATABASE_SLAVE_PORT: 5432
      VCS_DATABASE_SLAVE_USER: postgres
      VCS_DATABASE_SLAVE_PASSWORD: postgres
      VCS_DATABASE_SLAVE_DBNAME: trafficservice
      VCS_REDIS_HOST: redis:6379
      VCS_LOGGING_LEVEL: info
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  capacity-service:
    build:
      context: ./capacity-service
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      VCS_SERVER_PORT: 8081
      VCS_DATABASE_MASTER_HOST: db
      VCS_DATABASE_MASTER_PORT: 5432
      VCS_DATABASE_MASTER_USER: postgres
      VCS_DATABASE_MASTER_PASSWORD: postgres
      VCS_DATABASE_MASTER_DBNAME: trafficservice
      VCS_DATABASE_SLAVE_HOST: db
      VCS_DATABASE_SLAVE_PORT: 5432
      VCS_DATABASE_SLAVE_USER: postgres
      VCS_DATABASE_SLAVE_PASSWORD: postgres
      VCS_DATABASE_SLAVE_DBNAME: trafficservice
      VCS_REDIS_HOST: redis:6379
      VCS_LOGGING_LEVEL: info
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  map-service:
    build:
      context: ./map-service
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8084:8084"
    environment:
      VCS_SERVER_PORT: 8084
      VCS_DATABASE_MASTER_HOST: db
      VCS_DATABASE_MASTER_PORT: 5432
      VCS_DATABASE_MASTER_USER: postgres
      VCS_DATABASE_MASTER_PASSWORD: postgres
      VCS_DATABASE_MASTER_DBNAME: trafficservice
      VCS_DATABASE_SLAVE_HOST: db
      VCS_DATABASE_SLAVE_PORT: 5432
      VCS_DATABASE_SLAVE_USER: postgres
      VCS_DATABASE_SLAVE_PASSWORD: postgres
      VCS_DATABASE_SLAVE_DBNAME: trafficservice
      VCS_REDIS_HOST: redis:6379
      VCS_LOGGING_LEVEL: info
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  journey-service:
    build:
      context: ./journey-service
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      VCS_SERVER_PORT: 8083
      VCS_DATABASE_MASTER_HOST: db
      VCS_DATABASE_MASTER_PORT: 5432
      VCS_DATABASE_MASTER_USER: postgres
      VCS_DATABASE_MASTER_PASSWORD: postgres
      VCS_DATABASE_MASTER_DBNAME: trafficservice
      VCS_DATABASE_SLAVE_HOST: db
      VCS_DATABASE_SLAVE_PORT: 5432
      VCS_DATABASE_SLAVE_USER: postgres
      VCS_DATABASE_SLAVE_PASSWORD: postgres
      VCS_DATABASE_SLAVE_DBNAME: trafficservice
      VCS_REDIS_HOST: redis:6379
      VCS_SERVICES_CAPACITY_URL: http://capacity-service:8081
      VCS_SERVICES_MAP_URL: http://map-service:8084
      VCS_SERVICES_IAM_URL: http://iam-service:8082
      VCS_SERVICES_JWT_SECRET: dev-secret
      VCS_LOGGING_LEVEL: info
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      capacity-service:
        condition: service_healthy
      map-service:
        condition: service_healthy
      iam-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8085:8085"
    environment:
      VCS_SERVER_PORT: 8085
      VCS_DATABASE_MASTER_HOST: db
      VCS_DATABASE_MASTER_PORT: 5432
      VCS_DATABASE_MASTER_USER: postgres
      VCS_DATABASE_MASTER_PASSWORD: postgres
      VCS_DATABASE_MASTER_DBNAME: trafficservice
      VCS_REDIS_HOST: redis:6379
      VCS_LOGGING_LEVEL: info
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── API Gateway + Frontend ─────────────────────────────────────────────────

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - iam-service
      - journey-service
      - capacity-service
      - map-service

volumes:
  pg_data:
