server:
  port: 8081
  timeout: 30s

database:
  master:
    host: "localhost"
    port: 5432
    user: "postgres"
    password: ""
    dbname: "trafficservice"
    max_open_conns: 25
    max_idle_conns: 5
  slave:
    host: "localhost"
    port: 5432
    user: "postgres"
    password: ""
    dbname: "trafficservice"
    max_open_conns: 50
    max_idle_conns: 10

redis:
  host: "localhost:6379"
  password: ""

capacity:
  vm_id: "vm-a"
  availability_cache_ttl: 30s
  orphan_cleanup_interval: 5m
  orphan_threshold: 5m

services:
  jwks_url: ""

logging:
  level: "info"
  format: "console"
