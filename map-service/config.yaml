server:
  port: 8084
  timeout: 30s

database:
  master:
    host: "localhost"
    port: 5432
    user: "postgres"
    password: ""
    dbname: "trafficservice"
    max_open_conns: 25
    max_idle_conns: 5
  slave:
    host: "localhost"
    port: 5432
    user: "postgres"
    password: ""
    dbname: "trafficservice"
    max_open_conns: 50
    max_idle_conns: 10

logging:
  level: "info"
  format: "console"

services:
  capacity_base_url: ""
  jwks_url: ""
  nominatim_base_url: "https://nominatim.openstreetmap.org"
  osrm_base_url: "https://router.project-osrm.org"
  user_agent: "vcs-map-service/1.0"
